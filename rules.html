<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分析模型说明书</title>
  <link rel="stylesheet" href="style.css?v=m22" />
  <style>
    .doc-wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }
    .doc-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .doc-back {
      color: #58A6FF;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .doc {
      background: #0F1620;
      border: 1px solid #1A2332;
      border-radius: 8px;
      padding: 16px;
      color: #C9D1D9;
      font-size: 13px;
      line-height: 1.7;
    }
    .doc h1, .doc h2, .doc h3 {
      color: #E6EDF3;
      margin: 18px 0 8px;
      line-height: 1.35;
    }
    .doc h1 { font-size: 22px; }
    .doc h2 { font-size: 17px; border-top: 1px solid #1F2A37; padding-top: 14px; }
    .doc h3 { font-size: 14px; color: #58A6FF; }
    .doc p { margin: 6px 0; }
    .doc ul { margin: 6px 0 10px 18px; padding: 0; }
    .doc li { margin: 3px 0; }
    .doc code {
      background: #111826;
      border: 1px solid #263241;
      border-radius: 4px;
      padding: 1px 5px;
      color: #FFD166;
    }
    .doc pre {
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.55;
    }
    .doc table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 12px;
      font-size: 12px;
    }
    .doc th, .doc td {
      border: 1px solid #263241;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    .doc th { background: #111826; color: #E6EDF3; }
  </style>
</head>
<body>
  <main class="doc-wrap">
    <div class="doc-top">
      <a class="doc-back" href="index.html">← 返回看板</a>
      <h1 style="margin:0;font-size:18px">分析模型说明书</h1>
    </div>
    <article id="doc" class="doc">加载中...</article>
  </main>
  <script>
    const docEl = document.getElementById("doc");

    fetch("RULES.md?t=" + Date.now())
      .then(res => {
        if (!res.ok) throw new Error("RULES.md 加载失败");
        return res.text();
      })
      .then(text => {
        docEl.innerHTML = renderMarkdown(text);
      })
      .catch(err => {
        docEl.textContent = err.message;
      });

    function renderMarkdown(text) {
      const lines = text.split(/\r?\n/);
      let html = "";
      let inCode = false;
      let listOpen = false;
      let tableRows = [];

      const closeList = () => {
        if (listOpen) {
          html += "</ul>";
          listOpen = false;
        }
      };
      const flushTable = () => {
        if (!tableRows.length) return;
        const rows = tableRows.filter(row => !/^\|\s*-+/.test(row));
        html += "<table>" + rows.map((row, index) => {
          const cells = row.split("|").slice(1, -1).map(cell => `<${index === 0 ? "th" : "td"}>${inline(cell.trim())}</${index === 0 ? "th" : "td"}>`).join("");
          return `<tr>${cells}</tr>`;
        }).join("") + "</table>";
        tableRows = [];
      };

      for (const line of lines) {
        if (line.trim().startsWith("```")) {
          flushTable();
          closeList();
          html += inCode ? "</pre>" : "<pre>";
          inCode = !inCode;
          continue;
        }
        if (inCode) {
          html += escapeHtml(line) + "\n";
          continue;
        }
        if (/^\|.+\|$/.test(line.trim())) {
          closeList();
          tableRows.push(line.trim());
          continue;
        }
        flushTable();
        if (line.startsWith("### ")) {
          closeList();
          html += `<h3>${inline(line.slice(4))}</h3>`;
        } else if (line.startsWith("## ")) {
          closeList();
          html += `<h2>${inline(line.slice(3))}</h2>`;
        } else if (line.startsWith("# ")) {
          closeList();
          html += `<h1>${inline(line.slice(2))}</h1>`;
        } else if (/^- /.test(line)) {
          if (!listOpen) {
            html += "<ul>";
            listOpen = true;
          }
          html += `<li>${inline(line.slice(2))}</li>`;
        } else if (!line.trim()) {
          closeList();
        } else if (/^---+$/.test(line.trim())) {
          closeList();
          html += "";
        } else {
          closeList();
          html += `<p>${inline(line)}</p>`;
        }
      }
      flushTable();
      closeList();
      return html;
    }

    function inline(value) {
      return escapeHtml(value)
        .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
  </script>
</body>
</html>
