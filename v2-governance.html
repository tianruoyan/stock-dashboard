<section class="module-card spaced-card" id="source-manager"><div class="module-heading"><div><span class="eyebrow">本机私有配置</span><h2>关注来源管理</h2></div><span class="subtle">小红书 · 微博 · 公众号 · 其他</span></div><p class="source-manager-intro">在这里直接添加、编辑、停用或删除关注来源。</p><form id="blogger-source-form" class="source-manager-form"><input id="blogger-source-id" type="hidden"><label><span>平台</span><select id="blogger-source-platform" required><option value="xiaohongshu">小红书</option><option value="weibo">微博</option><option value="wechat">微信公众号</option><option value="douyin">抖音</option><option value="bilibili">哔哩哔哩</option><option value="other">其他</option></select></label><label><span>账号名称</span><input id="blogger-source-name" maxlength="80" required placeholder="例如：某产业研究员"></label><label class="source-url-field"><span>主页或文章链接</span><input id="blogger-source-url" type="url" required placeholder="https://..."></label><label class="source-note-field"><span>关注说明</span><input id="blogger-source-note" maxlength="500" placeholder="例如：跟踪半导体设备产业信息"></label><div class="source-form-actions"><button type="submit" class="source-primary-action">保存来源</button><button type="button" id="blogger-source-cancel" hidden>取消编辑</button></div></form><div id="blogger-source-status" class="source-manager-status" aria-live="polite"></div><div id="blogger-source-list" class="source-manager-list"></div></section>
