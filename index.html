<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Logic Terminal V1</title>
  <link rel="stylesheet" href="style.css?v=20260630-red-up-green-down"/>
</head>

<body>

<header class="topbar">
  <div class="left">⚙️ V1 Terminal · <a href="RULES.md" target="_blank" style="color:#58A6FF;font-size:11px">分析模型</a></div>

  <div class="center">
    <span id="status">🟢 LIVE</span>
  </div>

  <div class="right">
    <span id="lastUpdate">--:--:--</span>
  </div>
</header>

<main>

  <!-- 盘中异动 -->
  <section class="panel">
    <h2>🔴 盘中异动</h2>
    <div id="alerts" class="grid"></div>
  </section>

  <!-- 盘中全景 -->
  <section class="panel">
    <h2>📊 盘中全景</h2>
    <div id="intraday-indices" class="index-row"></div>
    <div class="sector-grid">
      <div class="sector-col">
        <h3>🔥 概念涨幅榜</h3>
        <div id="concept-top" class="sector-list"></div>
      </div>
      <div class="sector-col">
        <h3>❄️ 概念跌幅榜</h3>
        <div id="concept-bot" class="sector-list"></div>
      </div>
    </div>
    <div class="sector-grid">
      <div class="sector-col">
        <h3>🏭 行业涨幅榜</h3>
        <div id="industry-top" class="sector-list"></div>
      </div>
      <div class="sector-col">
        <h3>📉 行业跌幅榜</h3>
        <div id="industry-bot" class="sector-list"></div>
      </div>
    </div>
  </section>

  <!-- 盘前 -->
  <section class="panel">
    <h2>☀️ 盘前简报</h2>
    <pre id="premarket"></pre>
  </section>

  <!-- 盘后 -->
  <section class="panel">
    <h2>🌙 盘后复盘</h2>
    <pre id="postmarket"></pre>

    <h3>晚间舆情</h3>
    <pre id="evening"></pre>
  </section>

  <!-- 专题 -->
  <section class="panel">
    <h2>🔍 专题跟踪</h2>
    <div id="topics" class="grid"></div>
  </section>

</main>

<footer class="footer">
  <a href="RULES.md" target="_blank">📐 分析模型说明书</a>
  <span class="muted">— 每个面板的数据源、规则、阈值。模型是核心资产，持续迭代。</span>
</footer>

<script src="app.js"></script>
</body>
</html>
